{% extends "base.html" %}
{% block extra_head %}
<script src="https://telegram.org/js/telegram-web-app.js"></script>
{% endblock %}
{% block content %}
<div class="section narrow" style="text-align:center;">
  <h1 class="heading" style="margin-bottom:16px;">CakeBar</h1>
  <p id="tg-status" style="color:var(--color-smoke);">Telegram orqali kirilmoqda…</p>
  <p id="tg-fallback" style="display:none;margin-top:16px;">
    <a href="{% url 'product_list' %}" class="pill pill-dark">Do'konga o'tish</a>
  </p>
</div>
<script>
(function () {
  var statusEl = document.getElementById("tg-status");
  var fallback = document.getElementById("tg-fallback");
  function done(message) {
    if (message) { statusEl.textContent = message; }
    fallback.style.display = "block";
  }
  var tg = window.Telegram && window.Telegram.WebApp;
  if (!tg || !tg.initData) {
    done("Bu sahifa Telegram ichida ochilganda avtomatik kiradi.");
    return;
  }
  tg.ready();
  tg.expand();
  var body = new FormData();
  body.append("init_data", tg.initData);
  body.append("csrfmiddlewaretoken", "{{ csrf_token }}");
  fetch("{% url 'telegram_mini_app_auth' %}", { method: "POST", body: body, credentials: "same-origin" })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.ok && data.linked) { window.location.replace(data.redirect); return; }
      done(data.message || "Kirib bo'lmadi.");
    })
    .catch(function () { done("Tarmoq xatosi — qaytadan urinib ko'ring."); });
})();
</script>
{% endblock %}
