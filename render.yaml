databases:
  - name: cakebar-db
    plan: free
    databaseName: cakebar
    user: cakebar

services:
  - type: web
    name: cakebar-web
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: CAKEBAR_SECRET_KEY
        generateValue: true
      - key: CAKEBAR_DATABASE_URL
        fromDatabase:
          name: cakebar-db
          property: connectionString
      - key: CAKEBAR_ALLOWED_HOSTS
        fromService:
          type: web
          name: cakebar-web
          property: host
      - key: PYTHON_VERSION
        value: "3.13.7"

# No worker service here: Render's free plan doesn't run background workers.
# Unpaid orders still expire fine without it — dashboard.views.admin_dashboard
# already calls orders.services.expire_unpaid_orders() as a safety net on
# every admin-panel load. Add a `type: worker` service later if/when this
# project moves to a paid Render plan and you want the dedicated loop back.
